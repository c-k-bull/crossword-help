name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crosshelp_test
          POSTGRES_USER: crosshelp
          POSTGRES_PASSWORD: crosshelp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database schema
        env:
          PGPASSWORD: crosshelp
        run: |
          psql -h localhost -U crosshelp -d crosshelp_test -f crosshelp/db/schema.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://crosshelp:crosshelp@localhost:5432/crosshelp_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -v