services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crosshelp
      POSTGRES_USER: crosshelp
      POSTGRES_PASSWORD: crosshelp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crosshelp/db/schema.sql:/docker-entreypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosshelp"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://crosshelp:crosshelp@db:5432/crosshelp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: "5001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./crosshelp:/app/crosshelp
volumes:
  postgres_data: