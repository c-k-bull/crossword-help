services:
  - type: web
    name: crossword-helper
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crosshelp-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false